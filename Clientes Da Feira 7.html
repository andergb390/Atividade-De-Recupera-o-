<!DOCTYPE html>
<html>
<head>
    <title>Clientes da Feira</title>
</head>
<body>

<h1>Clientes da Feira</h1>

<button onclick="iniciar()">Começar Compras</button>

<h2 id="resultado"></h2>

<script>

function iniciar() {

    let brindes = 0;

    for (let i = 1; i <= 3; i++) {

        let compra = prompt("Digite o valor da compra do cliente " + i);

        if (compra > 100) {

            brindes++;
        }
    }

    document.getElementById("resultado").innerHTML =
    "Total de brindes: " + brindes;
}

</script>

</body>
</html>
