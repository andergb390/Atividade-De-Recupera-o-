<!DOCTYPE html>
<html>
<head>
    <title>Feitico do Mago</title>
</head>
<body>

<h1>Feitico do Mago</h1>

<button onclick="lancarFeitico()">FireBall</button>

<h2 id="resultado"></h2>

<script>

function lancarFeitico() {

    let texto = "";

    for (let i = 1; i <= 5; i++) {

        texto += i + "<br>";
    }

    document.getElementById("resultado").innerHTML = texto;
}

</script>

</body>
</html>
